# Amount is the top of the band. The last band has no cap.
bands:
  - max_amount: 1000000
    grades:
      "1-4": Credit Officer
      "5-6": Senior Credit Officer
      "7+": Credit Committee
  - max_amount: 5000000
    grades:
      "1-4": Senior Credit Officer
      "5-6": Credit Committee
      "7+": Credit Committee
  - max_amount: 25000000
    grades:
      "1-4": Credit Committee
      "5-6": Credit Committee
      "7+": Board Credit Committee
  - max_amount: null
    grades:
      "1-4": Board Credit Committee
      "5-6": Board Credit Committee
      "7+": Board Credit Committee
